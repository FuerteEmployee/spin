# Add these two blocks inside the existing `server { ... }` for billingsphere.com
# (usually /etc/nginx/sites-available/billingsphere.com), ABOVE the `location / { proxy_pass ... }` block.
# Then upload the contents of the zip to /var/www/spinandwin/ and run:
#   sudo nginx -t && sudo systemctl reload nginx

location = /spinandwin {
    return 301 /spinandwin/;
}

location ^~ /spinandwin/ {
    alias /var/www/spinandwin/;
    index index.html;
    try_files $uri $uri/ /spinandwin/index.html;

    # Hashed JS/CSS can be cached forever; index.html must always be fresh
    location ~* ^/spinandwin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
